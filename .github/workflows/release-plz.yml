name: release-plz

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches: [main]

jobs:
  # Publish unpublished versions to crates.io (and create the git tag / GitHub
  # release) once a release PR is merged into main.
  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # ALSA headers are needed by alsa-sys (via cpal) on Linux. release-plz
      # builds the crate here: `release` runs `cargo publish` and `release-pr`
      # runs cargo-semver-checks (rustdoc), and both fail without `alsa.pc`.
      - name: install Linux audio deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Open/update the "release" PR that bumps the version and updates the changelog.
  release-plz-pr:
    name: release-plz pr
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # ALSA headers are needed by alsa-sys (via cpal) on Linux. release-plz
      # builds the crate here: `release` runs `cargo publish` and `release-pr`
      # runs cargo-semver-checks (rustdoc), and both fail without `alsa.pc`.
      - name: install Linux audio deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
