name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Include the runner image version in the cache key so a runner-image
          # (e.g. Xcode) update invalidates the cache. Otherwise a restored
          # `target/` keeps stale C-dependency linker paths from the previous
          # image (libopus / onnxruntime, clang_rt.osx) and the macOS link step
          # fails with "library 'clang_rt.osx' not found".
          #
          # `env-vars` hashes the *values* of these runner-set variables into the
          # key. A `${{ env.ImageVersion }}` expression does NOT work here: the
          # `env` context only exposes workflow-defined vars, not runner-injected
          # ones like ImageVersion, so it resolves to an empty (no-op) key.
          env-vars: "ImageOS ImageVersion"
      # ALSA headers are needed to build cpal on Linux. CMake (for the `opus`
      # feature's vendored libopus) is preinstalled on the GitHub runners.
      - name: install Linux audio deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test (all features)
        run: cargo test --all-features
      - name: doc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: build (no default features — WAV only, no native codec deps)
        run: cargo build --no-default-features

  mobile:
    name: mobile clippy (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-ios
            os: macos-latest
          - target: aarch64-apple-ios-sim
            os: macos-latest
          - target: aarch64-linux-android
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          env-vars: "ImageOS ImageVersion"
          key: ${{ matrix.target }}
      # cargo-ndk wires the preinstalled NDK toolchain into rustc and into the
      # cc/cmake builds of the vendored libopus/libopusenc. `cache-bin` in
      # rust-cache keeps ~/.cargo/bin, so the install is a no-op after the
      # first run.
      - name: install cargo-ndk
        if: contains(matrix.target, 'android')
        run: cargo install cargo-ndk
      # ANDROID_NDK_HOME is read by cargo-ndk; ANDROID_NDK_ROOT by CMake's
      # Android platform detection (the vendored libopus builds with cmake).
      # Point both at the same (latest preinstalled) NDK. The runner exports
      # ANDROID_NDK_LATEST_HOME only as a process env var — it is not in the
      # `${{ env }}` context — so it has to be read from the shell.
      - name: point ANDROID_NDK_HOME / ANDROID_NDK_ROOT at the preinstalled NDK
        if: contains(matrix.target, 'android')
        run: |
          test -d "$ANDROID_NDK_LATEST_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      # `-P 26`: cpal's AAudio backend needs Android API level 26+.
      - name: clippy (android, default features incl. opus)
        if: contains(matrix.target, 'android')
        run: cargo ndk -t arm64-v8a -P 26 clippy --all-targets -- -D warnings
      - name: build (android, no default features)
        if: contains(matrix.target, 'android')
        run: cargo ndk -t arm64-v8a -P 26 build --no-default-features
      - name: clippy (ios, default features incl. opus)
        if: contains(matrix.target, 'apple-ios')
        run: cargo clippy --target ${{ matrix.target }} --all-targets -- -D warnings
      - name: build (ios, no default features)
        if: contains(matrix.target, 'apple-ios')
        run: cargo build --target ${{ matrix.target }} --no-default-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.52.0
