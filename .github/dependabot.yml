version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    # Wait 7 days after a release before proposing it (supply chain mitigation).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Wait 7 days after a release before proposing it (supply chain mitigation).
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
