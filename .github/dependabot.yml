version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    # Wait 1 day after a release before proposing it (supply chain mitigation).
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Wait 1 day after a release before proposing it (supply chain mitigation).
    cooldown:
      default-days: 1
    groups:
      actions:
        patterns: ["*"]
